name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version-file: ".python-version"
          enable-cache: true
      - name: Sync deps
        run: uv sync --locked
      # Both gates, not just check: `ruff check` is blind to layout. E501 is ignored
      # and the preview blank-line rules (E301-E306) are not in `select`, so the
      # formatter is the only thing that sees wrapping and blank-line drift.
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version-file: ".python-version"
          enable-cache: true
      - name: Sync deps
        run: uv sync --locked
      # Ratchet gate: fails only on NEW errors, baselined ones tracked in mypy-baseline.txt.
      # set +o pipefail — mypy always exits non-zero on baselined errors; filter's exit is the real gate.
      - name: Mypy (baseline ratchet)
        run: |
          set +o pipefail
          uv run mypy src/tr_shared/ | uv run mypy-baseline filter

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version-file: ".python-version"
          enable-cache: true
      - name: Sync deps
        run: uv sync --locked
      - name: Pytest
        run: uv run pytest
